pre-commit:
  parallel: true
  commands:
    betterleaks:
      run: bash runners/run-betterleaks.sh --staged

    secretlint:
      glob: "**/*"
      run: bash runners/run-secretlint.sh {staged_files}
      skip:
        - empty

prepare-commit-msg:
  commands:
    prepare-message-script:
      run: bash -c './scripts/prepare-commit-msg.sh --output "{1}"'

# check commit message as Conventional Commit
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: commitlint --config ./configs/commitlint.config.mjs --edit
